<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interface simple pour gérer des demandes EcoReno" />
    <title>EcoReno</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f8f5;
        --panel: #ffffff;
        --text: #163126;
        --muted: #5f7a6d;
        --accent: #2f7d5b;
        --accent-dark: #215c43;
        --border: #dbe8e0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
      }
      header {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(22,49,38,0.06);
      }
      h1 { margin: 0 0 8px; }
      p { margin: 0; color: var(--muted); }
      .grid {
        display: grid;
        gap: 24px;
        grid-template-columns: 1.1fr 0.9fr;
        margin-top: 24px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
      }
      form { display: grid; gap: 12px; }
      label { font-weight: 600; }
      input, select, textarea, button {
        width: 100%;
        font: inherit;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
      }
      button {
        background: var(--accent);
        color: white;
        border: none;
        cursor: pointer;
      }
      button:hover { background: var(--accent-dark); }
      .demande-list { display: grid; gap: 12px; }
      .demande-item {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        background: #fbfdfb;
      }
      .muted { color: var(--muted); font-size: 0.95rem; }
      .form-error {
        color: #b3261e;
        font-size: 0.95rem;
        font-weight: 600;
        margin: 0;
      }
      .form-success {
        color: var(--accent-dark);
        font-size: 0.95rem;
        font-weight: 600;
        margin: 0;
      }
      @media (max-width: 760px) {
        .grid { grid-template-columns: 1fr; }
        .page { padding: 16px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <h1>EcoReno</h1>
        <p>Suivez vos demandes de rénovation écologique avec une interface simple et accessible.</p>
      </header>

      <section class="grid" aria-label="Gestion des demandes">
        <div class="card">
          <h2>Créer une demande</h2>
          <form id="demande-form">
            <label for="name">Nom de la demande</label>
            <input id="name" name="name" required minlength="3" maxlength="120" />

            <label for="owner">Nom du client</label>
            <input id="owner" name="owner" required minlength="2" maxlength="120" />

            <label for="budget">Budget</label>
            <input id="budget" name="budget" type="number" min="0.01" step="0.01" required />

            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3" maxlength="1000"></textarea>

            <!-- Impact estimé : champ obligatoire côté DTO (DemandeWriteDto.Impact) -->
            <label for="impact">Impact estimé</label>
            <input id="impact" name="impact" required maxlength="300" />

            <label for="status">Statut</label>
            <select id="status" name="status" required>
              <option value="Recue">Reçue</option>
              <option value="EnQualification">En qualification</option>
              <option value="DevisEnvoye">Devis envoyé</option>
              <option value="Planifiee">Planifiée</option>
              <option value="Terminee">Terminée</option>
              <option value="Refusee">Refusée</option>
            </select>

            <p id="form-error" class="form-error" role="alert" hidden></p>

            <button type="submit">Ajouter</button>
          </form>
        </div>

        <div class="card">
          <h2>Demandes récentes</h2>
          <div id="demande-list" class="demande-list" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <script>
      const list = document.getElementById('demande-list');
      const form = document.getElementById('demande-form');

      const errorSlot = document.getElementById('form-error');

      function showError(message) {
        errorSlot.textContent = message;
        errorSlot.className = 'form-error';
        errorSlot.hidden = false;
      }

      function showSuccess(message) {
        errorSlot.textContent = message;
        errorSlot.className = 'form-success';
        errorSlot.hidden = false;
      }

      function clearMessage() {
        errorSlot.textContent = '';
        errorSlot.hidden = true;
      }

      // Transforme la réponse de validation ASP.NET Core (RFC 9110) en message lisible :
      // { "errors": { "Impact": ["L'impact estimé est obligatoire"] } }
      function describeValidationErrors(problem) {
        if (!problem || !problem.errors) {
          return null;
        }
        return Object.entries(problem.errors)
          .map(([field, messages]) => `${field} : ${[].concat(messages).join(' ')}`)
          .join(' | ');
      }

      async function loadDemandes() {
        try {
          const response = await fetch('/api/demandes');
          if (!response.ok) {
            list.innerHTML = '';
            const message = document.createElement('p');
            message.className = 'muted';
            message.textContent = 'Impossible de charger les demandes.';
            list.appendChild(message);
            return;
          }

          const demandes = await response.json();
          list.innerHTML = '';

          if (!Array.isArray(demandes) || !demandes.length) {
            const empty = document.createElement('p');
            empty.className = 'muted';
            empty.textContent = 'Aucune demande pour le moment.';
            list.appendChild(empty);
            return;
          }

          demandes.forEach((demande) => {
            const item = document.createElement('article');
            item.className = 'demande-item';

            // Construction du DOM via textContent : neutralise toute injection de balises
            // (XSS stocké) provenant des champs saisis par l'utilisateur.
            const title = document.createElement('h3');
            title.textContent = demande.name ?? '';
            item.appendChild(title);

            const rows = [
              { text: `Client : ${demande.owner ?? ''}`, muted: true },
              { text: `Budget : ${demande.budget ?? 0} €`, muted: false },
              { text: `Description : ${demande.description || 'À compléter'}`, muted: false },
              { text: `Impact : ${demande.impact || 'À compléter'}`, muted: false },
              { text: `Statut : ${demande.status || 'Recue'}`, muted: false },
            ];

            rows.forEach(({ text, muted }) => {
              const paragraph = document.createElement('p');
              if (muted) {
                paragraph.className = 'muted';
              }
              paragraph.textContent = text;
              item.appendChild(paragraph);
            });

            list.appendChild(item);
          });
        } catch (error) {
          console.error(error);
          list.innerHTML = '';
          const message = document.createElement('p');
          message.className = 'muted';
          message.textContent = 'Impossible de charger les demandes.';
          list.appendChild(message);
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        clearMessage();

        const payload = Object.fromEntries(new FormData(form).entries());
        payload.budget = Number(payload.budget);

        try {
          const response = await fetch('/api/demandes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            // Sans ce else, un 400 était avalé en silence et le bouton semblait inerte.
            let details = null;
            try {
              details = describeValidationErrors(await response.json());
            } catch {
              details = null;
            }
            showError(details
              ? `Ajout refusé (erreur ${response.status}) — ${details}`
              : `Ajout refusé (erreur ${response.status}).`);
            return;
          }

          form.reset();
          await loadDemandes();
          showSuccess('Demande ajoutée.');
        } catch (error) {
          console.error(error);
          showError("Impossible de contacter le serveur. Vérifiez qu'il est démarré, puis réessayez.");
        }
      });

      loadDemandes();
    </script>
  </body>
</html>
