<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interface simple pour gérer des demandes EcoReno" />
    <title>EcoReno</title>

    <link rel="stylesheet" href="Style.css"/>

</head>
<body>
    <main class="page">
        <header>
            <h1>EcoReno</h1>
            <p>Suivez vos demandes de rénovation écologique avec une interface simple et accessible.</p>
        </header>

        <section class="grid" aria-label="Gestion des demandes">
            <div class="card">
                <h2>Créer une demande</h2>
                <form id="demande-form">
                    <label for="name">Nom de la demande</label>
                    <input id="name" name="name" required minlength="3" maxlength="120" />

                    <label for="owner">Nom du client</label>
                    <input id="owner" name="owner" required minlength="2" maxlength="120" />

                    <label for="budget">Budget</label>
                    <input id="budget" name="budget" type="number" min="0.01" step="0.01" required />

                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="3" maxlength="1000"></textarea>

                    <!-- Impact estimé : champ obligatoire côté DTO (DemandeWriteDto.Impact) -->
                    <label for="impact">Impact estimé</label>
                    <input id="impact" name="impact" required maxlength="300" />

                    <label for="status">Statut</label>
                    <select id="status" name="status" required>
                        <option value="Recue">Reçue</option>
                        <option value="EnQualification">En qualification</option>
                        <option value="DevisEnvoye">Devis envoyé</option>
                        <option value="Planifiee">Planifiée</option>
                        <option value="Terminee">Terminée</option>
                        <option value="Refusee">Refusée</option>
                    </select>

                    <p id="form-error" class="form-error" role="alert" hidden></p>

                    <button type="submit">Ajouter</button>
                </form>
            </div>

            <div class="card">
                <h2>Demandes récentes</h2>
                <div id="demande-list" class="demande-list" aria-live="polite"></div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
